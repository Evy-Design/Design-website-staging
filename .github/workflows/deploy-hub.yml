name: Deploy client hub

# Builds the client hub (npm run build-hub -> dist-hub/) and uploads it
# over SFTP to the Strato folder that hub.evydiepenbroek.nl
# points to. Runs on every push to main that touches a hub file or a
# shared file the hub uses, and can be started by hand (Actions tab ->
# Deploy client hub -> Run workflow).
#
# Uses the same SFTP secrets as sync-content.yml, plus one more:
#   SFTP_HUB_PATH  the subdomain's folder on Strato, e.g. /client-hub
on:
  push:
    branches: [main]
    paths:
      - "client-hub*"
      - "client-portal*"
      - "shared.css"
      - "style.css"
      - "test-navigation.*"
      - "cart.*"
      - "chrome.js"
      - "sanity-client.js"
      - "content.js"
      - "script.js"
      - "fonts/**"
      - "scripts/build-hub.mjs"
      - ".github/workflows/deploy-hub.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-hub
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the hub
        run: node scripts/build-hub.mjs

      - name: Upload to Strato (SFTP)
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_HUB_PATH: ${{ secrets.SFTP_HUB_PATH }}
        run: |
          if [ -z "$SFTP_HOST" ] || [ -z "$SFTP_USER" ] || [ -z "$SFTP_PASSWORD" ] || [ -z "$SFTP_HUB_PATH" ]; then
            echo "SFTP secrets (incl. SFTP_HUB_PATH) not set - skipping upload."
            exit 0
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          mkdir -p ~/.ssh
          # Same pinned Strato host keys as sync-content.yml.
          cat > ~/.ssh/known_hosts <<'KEYS'
          59907067.ssh.w1.strato.hosting ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINbBMvvDjN4IP04VAZlDH42A+HL25ifeIK9CorAvaMA/
          59907067.ssh.w1.strato.hosting ssh-rsa 
          KEYS
          sed -i 's/^ *//' ~/.ssh/known_hosts
          DEST="${SFTP_HUB_PATH%/}"
          # "-" before a command: keep going if the folder already exists.
          {
            echo "-mkdir $DEST"
            echo "-mkdir $DEST/fonts"
            echo "lcd dist-hub"
            echo "put -r . $DEST"
          } | SSHPASS="$SFTP_PASSWORD" sshpass -e sftp \
              -o StrictHostKeyChecking=yes \
              -o PreferredAuthentications=password \
              -b - "$SFTP_USER@$SFTP_HOST"
          echo "Uploaded the client hub to $DEST/"
