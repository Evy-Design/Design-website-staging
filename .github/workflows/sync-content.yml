name: Sync content from Sanity

# Triggered by a Sanity webhook posting to
# https://api.github.com/repos/<owner>/<repo>/dispatches with
# event_type "sanity-publish" whenever content is published in the
# Studio. workflow_dispatch is kept as a manual fallback.
#
# Steps: fetch the latest content -> commit content.json to the repo
# (history/backup) -> upload content.json to the Strato webspace over
# SFTP, which is what actually serves staging.evydiepenbroek.nl.
#
# Needs these repository secrets (Settings > Secrets and variables >
# Actions): SFTP_HOST, SFTP_USER, SFTP_PASSWORD, SFTP_PATH.
on:
  repository_dispatch:
    types: [sanity-publish]
  workflow_dispatch: {}

# Runs triggered close together (Sanity can fire several webhooks per
# publish) queue up instead of racing each other's git push / upload.
concurrency:
  group: sync-content
  cancel-in-progress: false

jobs:
  build-content:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch latest content from Sanity
        run: node scripts/build-content.mjs

      - name: Commit and push if content changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content.json
          git diff --staged --quiet && echo "No content changes." || git commit -m "Sync content from Sanity"
          git pull --rebase
          git push

      - name: Upload content.json to Strato (SFTP)
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_PATH: ${{ secrets.SFTP_PATH }}
        run: |
          if [ -z "$SFTP_HOST" ] || [ -z "$SFTP_USER" ] || [ -z "$SFTP_PASSWORD" ] || [ -z "$SFTP_PATH" ]; then
            echo "SFTP secrets not set - skipping upload."
            exit 0
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          mkdir -p ~/.ssh
          # Pinned host keys for the Strato SFTP server (public info), so
          # the password is only ever sent to the real server. If Strato
          # rotates its keys, refresh these with:
          #   ssh-keyscan -t ed25519,rsa 59907067.ssh.w1.strato.hosting
          cat > ~/.ssh/known_hosts <<'KEYS'
          59907067.ssh.w1.strato.hosting ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINbBMvvDjN4IP04VAZlDH42A+HL25ifeIK9CorAvaMA/
          59907067.ssh.w1.strato.hosting ssh-rsa 
          KEYS
          sed -i 's/^ *//' ~/.ssh/known_hosts
          # The batch file is read from stdin, so nothing secret is echoed.
          echo "put content.json ${SFTP_PATH%/}/content.json" | \
            SSHPASS="$SFTP_PASSWORD" sshpass -e sftp \
              -o StrictHostKeyChecking=yes \
              -o PreferredAuthentications=password \
              -b - "$SFTP_USER@$SFTP_HOST"
          echo "Uploaded content.json to ${SFTP_PATH%/}/"
