<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Client portal — Evy Diepenbroek</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="stylesheet" href="shared.css?v=30" />
  <link rel="stylesheet" href="test-navigation.css?v=21" />
  <link rel="stylesheet" href="style.css?v=54" />
  <link rel="stylesheet" href="client-portal.css?v=1" />
  <link rel="stylesheet" href="cart.css?v=6" />
  <style>body { margin: 0; }</style>
  <script src="chrome.js?v=20"></script>
  <script src="client-hub-links.js?v=1"></script>
</head>
<body>

  <script>document.currentScript.insertAdjacentHTML("beforebegin", EOD_CHROME.nav());</script>

  <main class="eod-page">
    <section class="eod-portal">
      <div class="eod-portal__card">
        <h1 class="eod-portal__heading" data-eod-reveal>Client portal</h1>
        <p class="eod-portal__lede" data-eod-reveal data-eod-reveal-delay="1">Log in to follow the progress of your project.</p>

        <form class="eod-portal__form" data-eod-portal-form data-eod-reveal data-eod-reveal-delay="2" novalidate>
          <label class="eod-portal__field">
            <span class="eod-portal__label">Email address</span>
            <input class="eod-portal__input" type="email" name="email" autocomplete="email" autocapitalize="none" spellcheck="false" required />
          </label>

          <p class="eod-portal__status" data-eod-portal-status role="status" aria-live="polite" hidden></p>

          <button type="submit" class="eod-btn eod-btn--dark eod-portal__submit">
            <span class="eod-btn__label">Log in</span>
            <span class="eod-btn__circle eod-btn__circle--accent" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none"><path d="M24 20L24 6.66667L10.6667 6.66667M24 6.66667L6.66667 24" stroke-width="2" stroke-miterlimit="10"/></svg></span>
            <span class="eod-btn__circle eod-btn__circle--white" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none"><path d="M24 20L24 6.66667L10.6667 6.66667M24 6.66667L6.66667 24" stroke-width="2" stroke-miterlimit="10"/></svg></span>
          </button>
        </form>

        <p class="eod-portal__help" data-eod-reveal data-eod-reveal-delay="3">No access yet? <a href="contact.html" class="eod-portal__help-link">Get in touch with Evy</a> · <a href="client-hub.html?demo" class="eod-portal__help-link" data-eod-portal-demo>View the demo</a></p>
      </div>
    </section>

  <script>document.currentScript.insertAdjacentHTML("beforebegin", EOD_CHROME.footer());</script>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/CustomEase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/Observer.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/ScrollTrigger.min.js"></script>
  <script src="test-navigation.js?v=17"></script>
  <script src="sanity-client.js?v=5"></script>
  <script src="content.js?v=58"></script>
  <script src="script.js?v=59"></script>
  <script src="cart.js?v=3"></script>
  <script src="client-portal.js?v=4"></script>
</body>
</html>
